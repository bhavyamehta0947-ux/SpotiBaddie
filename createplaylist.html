<!-- why popup (hidden) -->
<div id="why-popup" class="why-popup hidden">Why? :(</div>

<script>
document.addEventListener('click', function(e){
    const more = e.target.closest('[data-testid="more-button"]');
    const deleteBtn = e.target.closest('.delete-song');
    const popup = document.getElementById('why-popup');

    // close all menus/popup when clicking outside
    if (!more && !deleteBtn) {
        document.querySelectorAll('.track-menu').forEach(m=>{
            m.classList.add('hidden');
            m.setAttribute('aria-hidden','true');
            const del = m.querySelector('.delete-song');
            if (del) { del.style.pointerEvents = 'auto'; del.style.transform = ''; }
        });
        if (popup) popup.classList.add('hidden');
        return;
    }

    // toggle menu for clicked more button
    if (more) {
        e.stopPropagation();
        // hide other menus
        document.querySelectorAll('.track-menu').forEach(m=>{ if (!m.contains(more)) m.classList.add('hidden'); m.setAttribute('aria-hidden','true'); });
        const row = more.closest('[data-testid="tracklist-row"]');
        const menu = row && row.querySelector('.track-menu');
        if (menu) {
            const isHidden = menu.classList.contains('hidden');
            document.querySelectorAll('.track-menu').forEach(m=>{ m.classList.add('hidden'); m.setAttribute('aria-hidden','true'); const d = m.querySelector('.delete-song'); if (d) { d.style.pointerEvents = 'auto'; d.style.transform = ''; } });
            if (isHidden) {
                menu.classList.remove('hidden');
                menu.setAttribute('aria-hidden','false');
                // make delete option red and playfully dodge for a short time
                const del = menu.querySelector('.delete-song');
                if (del) {
                    // ensure relative positioning for transforms
                    del.style.position = 'relative';
                    // temporarily disable clicking while it moves
                    del.style.pointerEvents = 'none';
                    // small random movement inside menu for a duration
                    let moveInterval = null;
                    const duration = 2200; // ms
                    const step = 120; // ms
                    const start = Date.now();
                    const bounds = menu.getBoundingClientRect();
                    const delRect = del.getBoundingClientRect();
                    // compute allowed delta ranges (keep within menu)
                    // allow larger movement distances (bigger amplitude)
                    const maxX = Math.max(0, bounds.width - delRect.width - 8);
                    const maxY = Math.max(0, bounds.height - delRect.height - 8);
                    const amplitude = 2.2; // multiplier to increase travel distance
                    moveInterval = setInterval(()=>{
                        const elapsed = Date.now() - start;
                        // easing factor: start frantic then calm down
                        const t = Math.min(1, elapsed / duration);
                        // random displacement up to +/- (max * amplitude), easing towards 0
                        const randX = Math.round((Math.random() - 0.5) * maxX * amplitude * (1 - 0.25 * t));
                        const randY = Math.round((Math.random() - 0.5) * maxY * amplitude * (1 - 0.25 * t));
                        del.style.transform = `translate(${randX}px, ${randY}px)`;
                        if (elapsed >= duration) {
                            clearInterval(moveInterval);
                            del.style.transform = '';
                            del.style.pointerEvents = 'auto';
                        }
                    }, step);
                }
            }
        }
        return;
    }

    // delete option clicked -> show popup
    if (deleteBtn) {
        e.stopPropagation();
        if (popup) popup.classList.remove('hidden');
        // close menus and reset delete button state
        document.querySelectorAll('.track-menu').forEach(m=>{ m.classList.add('hidden'); m.setAttribute('aria-hidden','true'); const d = m.querySelector('.delete-song'); if (d) { d.style.pointerEvents = 'auto'; d.style.transform = ''; } });
        return;
    }
});
</script>
